# SonarQube settings for the frontend (used by scripts/011_sonar_scan.sh).
# Host, token, project key and organization are passed by the script, never stored here.
sonar.projectName=ProjectControl frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

# Coverage from 'npm run test:coverage' (vitest, v8)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx

# Fail the scan when the Quality Gate is red
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
