name: Secret scan

# Scans the full Git history for secrets (passwords, API keys, tokens, private keys)
# with gitleaks on every PR and every push to main/develop.
# Definition of Done, item 2: no secrets in the repository.
# Required status check in the ruleset "Protect main and develop".

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, not only the last commit

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose --no-banner
