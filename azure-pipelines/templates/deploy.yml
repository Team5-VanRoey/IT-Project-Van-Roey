# One DTAP deployment. BUILD ONCE, DEPLOY EVERYWHERE: nothing is built here; the images the CI
# pipeline built for this commit are resolved, scanned again and deployed by digest.
# Same scripts as GitHub Actions (.github/workflows/_deploy.yml).
parameters:
  - name: dtap               # test | acc | prod  (scripts and resource group names)
    type: string
  - name: environment        # Azure DevOps environment (approvals, deployment history)
    type: string
  - name: serviceConnection  # Azure Resource Manager service connection for this environment
    type: string
  - name: registryConnection
    type: string
    default: ghcr-projectcontrol

jobs:
  - deployment: deploy_${{ parameters.dtap }}
    displayName: Deploy to ${{ parameters.environment }}
    environment: ${{ parameters.environment }}
    timeoutInMinutes: 25
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              fetchDepth: 1
            - task: Docker@2
              displayName: Log in to the registry
              inputs:
                command: login
                containerRegistry: ${{ parameters.registryConnection }}
            - script: |
                images=$(sh scripts/014_images.sh resolve) || { echo "##vso[task.logissue type=error]No images for this commit: the CI pipeline builds them."; exit 1; }
                printf '%s\n' "$images"
                printf '%s\n' "$images" | while IFS='=' read -r k v; do echo "##vso[task.setvariable variable=$k]$v"; done
              displayName: 1. Resolve the images CI built for this commit
            - script: sh scripts/014_images.sh scan-deployed
              displayName: 2. Scan these exact images again (Trivy)
            - task: AzureCLI@2
              displayName: 3. Deploy, smoke test, rollback on failure
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: sh scripts/016_deploy_azure.sh "${{ parameters.dtap }}"
              env:
                API_IMAGE: $(API_IMAGE)
                WEB_IMAGE: $(WEB_IMAGE)
            - script: sh scripts/014_images.sh tag "${{ parameters.dtap }}"
              displayName: 4. Record which version runs in ${{ parameters.environment }}
